<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Frame -->
  <rect x="2" y="2" width="876" height="336" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Terminal Header Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 864 2 Q 878 2 878 16 L 878 38 L 2 38 Z" fill="#0f172a" />
  <circle cx="24" cy="20" r="5.5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5.5" fill="#eab308" />
  <circle cx="60" cy="20" r="5.5" fill="#22c55e" />
  <text x="440" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">SYSTEM ARCHITECTURE :: AGENTIC REASONING &amp; MULTI-TOOL ENGINE</text>

  <!-- 1. User Input Box -->
  <g transform="translate(30, 75)">
    <rect width="130" height="90" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="32" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">USER QUERY</text>
    <text x="65" y="52" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Natural Language</text>
    <text x="65" y="68" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Intent &amp; Constraints</text>
  </g>

  <!-- Arrow: Input -> Gateway -->
  <path d="M 160 120 L 205 120" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="205,116 213,120 205,124" fill="#00f2fe"/>

  <!-- 2. Gateway & Orchestrator -->
  <g transform="translate(215, 60)">
    <rect width="190" height="120" rx="10" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="26" rx="10" fill="#2e1065" />
    <path d="M 0 20 L 0 26 L 190 26 L 190 20 Z" fill="#2e1065" />
    <text x="95" y="17" fill="#e9d5ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LANGGRAPH AGENT CORE</text>
    
    <text x="20" y="50" fill="#38bdf8" font-family="monospace" font-size="11">▸ Planning &amp; ReAct</text>
    <text x="20" y="70" fill="#cbd5e1" font-family="monospace" font-size="11">▸ Tool Dispatcher</text>
    <text x="20" y="90" fill="#a7f3d0" font-family="monospace" font-size="11">▸ Cyclic Evaluation</text>
    <text x="20" y="106" fill="#94a3b8" font-family="monospace" font-size="9">State Machine &amp; Checkpoints</text>
  </g>

  <!-- Connectors from Agent Core to Execution Tools -->
  <path d="M 405 100 L 455 100 L 455 80 L 485 80" stroke="#6366f1" stroke-width="1.8" fill="none"/>
  <polygon points="485,76 493,80 485,84" fill="#6366f1"/>

  <path d="M 405 120 L 490 120" stroke="#00f2fe" stroke-width="1.8" fill="none"/>
  <polygon points="485,116 493,120 485,124" fill="#00f2fe"/>

  <path d="M 405 140 L 455 140 L 455 160 L 485 160" stroke="#10b981" stroke-width="1.8" fill="none"/>
  <polygon points="485,156 493,160 485,164" fill="#10b981"/>

  <!-- 3. Tool Execution Layer -->
  <g transform="translate(495, 55)">
    <!-- Tool 1: SQL Analytics -->
    <rect x="0" y="0" width="170" height="38" rx="6" fill="#111c33" stroke="#6366f1" stroke-width="1.2"/>
    <text x="12" y="16" fill="#c7d2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">DUCKDB SQL ANALYTICS</text>
    <text x="12" y="30" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5">Parquet Files • In-Memory OLAP</text>

    <!-- Tool 2: RAG & Vector Search -->
    <rect x="0" y="46" width="170" height="38" rx="6" fill="#111c33" stroke="#00f2fe" stroke-width="1.2"/>
    <text x="12" y="62" fill="#7dd3fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">FAISS VECTOR STORE</text>
    <text x="12" y="76" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5">Dense Retrieval • RAG Context</text>

    <!-- Tool 3: External APIs & Tools -->
    <rect x="0" y="92" width="170" height="38" rx="6" fill="#111c33" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="108" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">EXTERNAL APIs &amp; REPL</text>
    <text x="12" y="122" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5">Groq LPU • Live Data Lookup</text>
  </g>

  <!-- Connectors from Tools to Verification/Self-Correction -->
  <path d="M 665 120 L 705 120" stroke="#e2e8f0" stroke-width="1.5" />
  <polygon points="705,116 713,120 705,124" fill="#e2e8f0"/>

  <!-- 4. Verification & Conformal Gate -->
  <g transform="translate(715, 60)">
    <rect width="135" height="120" rx="10" fill="url(#card-grad)" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="0" y="0" width="135" height="26" rx="10" fill="#064e3b" />
    <path d="M 0 20 L 0 26 L 135 26 L 135 20 Z" fill="#064e3b" />
    <text x="67" y="17" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SAFETY &amp; VERIFY</text>

    <text x="12" y="48" fill="#86efac" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">✓ Grounding Check</text>
    <text x="12" y="66" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Claim Validation</text>
    <text x="12" y="84" fill="#86efac" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">✓ Conformal Gate</text>
    <text x="12" y="102" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Abstain or Synthesize</text>
  </g>

  <!-- Cyclic Self-Correction Feedback Loop -->
  <path d="M 782 180 L 782 225 L 310 225 L 310 180" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>
  <polygon points="306,188 310,180 314,188" fill="#f59e0b"/>
  <rect x="470" y="213" width="170" height="22" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="555" y="228" fill="#fef3c7" font-family="monospace" font-size="9.5" text-anchor="middle">↺ Cyclic Self-Correction Loop</text>

  <!-- Output Generation Arrow & Card -->
  <path d="M 782 60 L 782 30 L 860 30" stroke="#22c55e" stroke-width="0" fill="none"/>
  
  <!-- Bottom Status Dashboard -->
  <g transform="translate(30, 260)">
    <rect width="820" height="56" rx="8" fill="#0d1526" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Status 1 -->
    <circle cx="25" cy="28" r="4.5" fill="#22c55e" filter="url(#glow)"/>
    <text x="38" y="24" fill="#e2e8f0" font-family="monospace" font-size="10.5" font-weight="600">ORCHESTRATION</text>
    <text x="38" y="40" fill="#38bdf8" font-family="monospace" font-size="9.5">LangGraph State Machine</text>

    <!-- Status 2 -->
    <circle cx="230" cy="28" r="4.5" fill="#00f2fe" filter="url(#glow)"/>
    <text x="243" y="24" fill="#e2e8f0" font-family="monospace" font-size="10.5" font-weight="600">RETRIEVAL</text>
    <text x="243" y="40" fill="#38bdf8" font-family="monospace" font-size="9.5">Dense Vectors + Hybrid SQL</text>

    <!-- Status 3 -->
    <circle cx="440" cy="28" r="4.5" fill="#a855f7" filter="url(#glow)"/>
    <text x="453" y="24" fill="#e2e8f0" font-family="monospace" font-size="10.5" font-weight="600">INFERENCE</text>
    <text x="453" y="40" fill="#a855f7" font-family="monospace" font-size="9.5">Groq LPU / Local QLoRA</text>

    <!-- Status 4 -->
    <circle cx="650" cy="28" r="4.5" fill="#10b981" filter="url(#glow)"/>
    <text x="663" y="24" fill="#e2e8f0" font-family="monospace" font-size="10.5" font-weight="600">DEPLOYMENT</text>
    <text x="663" y="40" fill="#10b981" font-family="monospace" font-size="9.5">FastAPI Async Streaming</text>
  </g>
</svg>
